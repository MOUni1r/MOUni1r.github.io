<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mounir | Data Scientist & Machine Learning</title>

    <meta name="description"
          content="Mounir's Data Science and Machine Learning portfolio. Explore projects in predictive modeling, analytics, and business intelligence.">

    <style>

        /* =========================
           Global Styles
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        /* =========================
           Navigation
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .nav-inner {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #7c8cff;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #a7a7a7;
            font-size: 14px;
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* =========================
           Hero
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 80px;

            background:
                radial-gradient(
                    circle at 75% 35%,
                    rgba(85, 100, 255, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(120, 70, 255, 0.08),
                    transparent 25%
                );
        }

        .hero-content {
            max-width: 850px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            color: #9ca3af;
            font-size: 14px;

            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            background: #6ee7b7;
            border-radius: 50%;
        }

        .hero h1 {
            font-size: clamp(48px, 7vw, 82px);
            line-height: 1.03;
            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #858fff;
        }

        .hero-description {
            max-width: 690px;

            color: #a3a3a3;
            font-size: 19px;

            margin-bottom: 38px;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 13px 21px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.25s;
        }

        .btn-primary {
            background: #f5f5f5;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #ffffff;
        }

        .btn-secondary {
            border: 1px solid #2b2b2b;
            color: #e5e5e5;
        }

        .btn-secondary:hover {
            border-color: #555;
            transform: translateY(-2px);
        }

        /* =========================
           Section
        ========================= */

        section {
            padding: 110px 0;
        }

        .section-label {
            color: #858fff;
            font-size: 13px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(32px, 5vw, 48px);
            letter-spacing: -1.8px;
            margin-bottom: 15px;
        }

        .section-description {
            color: #8f8f8f;
            max-width: 650px;
            margin-bottom: 50px;
        }

        /* =========================
           Projects
        ========================= */

        .projects {
            background: #0d0d0d;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .project-card {
            position: relative;

            padding: 32px;

            min-height: 330px;

            border: 1px solid #222;
            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.01)
                );

            transition: 0.3s;
            overflow: hidden;
        }

        .project-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -70px;
            top: -70px;

            border-radius: 50%;

            background: rgba(110, 120, 255, 0.08);

            filter: blur(10px);
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #343434;
        }

        .project-number {
            color: #666;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .project-card h3 {
            font-size: 27px;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }

        .project-card p {
            color: #929292;
            font-size: 15px;

            max-width: 470px;

            margin-bottom: 25px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 10px;

            border: 1px solid #292929;
            border-radius: 6px;

            color: #a7a7a7;
            font-size: 12px;
        }

        .project-link {
            position: absolute;

            bottom: 30px;
            right: 30px;

            color: #858fff;
            font-size: 14px;
            font-weight: 600;
        }

        /* =========================
           Skills
        ========================= */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .skill {
            padding: 18px;

            border: 1px solid #222;
            border-radius: 10px;

            color: #c4c4c4;
            background: #0d0d0d;

            font-size: 14px;

            transition: 0.25s;
        }

        .skill:hover {
            border-color: #3a3a3a;
            transform: translateY(-2px);
        }

        /* =========================
           About
        ========================= */

        .about {
            background: #0d0d0d;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
        }

        .about-text {
            color: #969696;
            font-size: 16px;
        }

        .about-text p {
            margin-bottom: 18px;
        }

        .info-list
